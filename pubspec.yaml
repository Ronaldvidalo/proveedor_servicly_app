name: proveedor_servicly_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- UTILIDADES Y UI BÁSICA ---
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  path: ^1.9.0

  # --- TUS OTRAS DEPENDENCIAS ---
  table_calendar: ^3.0.9
  # ACTUALIZADO: Necesario para que coincida con el nuevo Core
  firebase_messaging: ^15.0.0
  url_launcher: ^6.3.1
  video_player: ^2.8.6
  collection: ^1.18.0
  showcaseview: ^3.0.0
  shared_preferences: ^2.2.3
  chewie: ^1.7.4
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  speech_to_text: ^7.3.0 # Para STT (Voz a Texto)
  flutter_tts: ^4.0.2    # Para TTS (Texto a Voz)
  video_thumbnail: ^0.5.3 # Para sacar la foto del video
  path_provider: ^2.1.2 # Necesario para guardar la miniatura temporal
  share_plus: ^10.0.0
  pdf: ^3.10.8       # Motor de creación de documentos
  printing: ^5.13.1  # Vista previa, impresión y compartir nativo
  

  # --- GESTIÓN DE ESTADO ---
  flutter_riverpod: ^2.5.1

  # --- UI & GRÁFICOS ---
  fl_chart: ^0.68.0

  # --- UTILIDADES ---
  intl: ^0.18.1
  uuid: ^4.4.0

  # --- FIREBASE (Versiones Actualizadas para WEB) ---
  # Subimos estas versiones para arreglar el error de Javascript
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.0.0
  rxdart: ^0.28.0
  image_picker: ^1.2.0
  firebase_storage: ^12.0.0
  firebase_app_check: ^0.3.2+1
  carousel_slider: ^5.1.1
  file_picker: ^10.3.7
  csv: ^6.0.0
  cloud_functions: ^5.0.0 # Nueva e importante
  google_generative_ai: ^0.1.0 # O la versión más reciente
  http: ^1.1.0 # Para llamadas HTTPS
  permission_handler: ^11.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # --- GENERADORES DE ASSETS ---
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# ============================================================
# CONFIGURACIÓN DE GENERADORES DE ASSETS
# ============================================================

# 1. Configuración del ÍCONO (Miniatura de la App)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/servicly_logo.png"
  min_sdk_android: 21
  # remove_alpha_ios: true

# 2. Configuración del SPLASH SCREEN (Pantalla de Carga Nativa)
flutter_native_splash:
  color: "#1A1A2E"
  
  # Imagen principal
  image: "assets/images/splash_logo_small.png"
  branding: "assets/images/splash_logo_small.png"
  
  # Modo oscuro
  color_dark: "#1A1A2E"
  image_dark: "assets/images/splash_logo_small.png"
  branding_dark: "assets/images/splash_logo_small.png"

  # Configuración específica Android 12
  android_12:
    image: "assets/images/splash_logo_small.png"
    icon_background_color: "#1A1A2E"